services:
  # postgresql database
  db:
    image: postgres:17.4 
    container_name: prayer_db 
    env_file:
      - .env
    restart: always
    ports:
      - "5433:5432"    # host:container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGPORT=5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} -p 5432"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s


  # django backend
  backend:
    build: .
    container_name: prayer_backend 
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
